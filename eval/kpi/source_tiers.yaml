# Source tiers for the source-quality KPI (capstone guide's three tiers).
#
#   primary        official pages of the company a claim is about, company press releases (incl.
#                  syndicated copies), government and regulator pages, company filings
#   top_secondary  peer-reviewed or academic work, respected analyst / research firms and industry
#                  bodies, news and trade press with named authors and editorial standards
#   weak           affiliate comparison sites, content farms, AI-generated summaries, anonymous or
#                  user-generated content (forums, social posts, video uploads, reviews), directories,
#                  job boards, vendor/agency marketing blogs, and index/tag pages that carry no claim
#
# The tier describes the SOURCE, not whether it supports the claim it is cited for. A primary page
# for the wrong company or market is still primary here; relevance is judged in the rubric
# (evidence quality) and reported separately as a limitation.
#
# How a URL is classified: the first matching `urls` rule (by URL prefix), else its domain's rule.
# `www.` is ignored. A domain with no rule is an error: every source must be classified on purpose.
# When a source could fairly sit in two tiers, the LOWER tier is used and the rule says why.

urls:
  # Yahoo Finance hosts syndicated press releases, algorithmic articles and wire news under one domain.
  - {prefix: "https://finance.yahoo.com/sectors/technology/articles/wire-3-launches-summer-offer", tier: primary, why: "Wire3 press release (Business Wire), syndicated"}
  - {prefix: "https://finance.yahoo.com/quote/CHTR/press-releases", tier: primary, why: "Charter's press-release index"}
  - {prefix: "https://finance.yahoo.com/quote/T/press-releases", tier: primary, why: "AT&T's press-release index"}
  - {prefix: "https://finance.yahoo.com/news/charter-launches-spectrum-mobile", tier: primary, why: "Charter press release, syndicated"}
  - {prefix: "https://streetinsider.com/Business+Wire/", tier: primary, why: "Business Wire press release, syndicated"}
  # Company-owned news and official company social accounts
  - {prefix: "https://spectrumlocalnews.com/us/snplus/business/", tier: top_secondary, why: "Spectrum News article (bylined news; owned by Charter, a conflict when about Spectrum)"}
  - {prefix: "https://x.com/ATTNEWS", tier: primary, why: "AT&T's official account"}
  - {prefix: "https://x.com/CharterNewsroom", tier: primary, why: "Charter's official account"}
  - {prefix: "https://facebook.com/TMobile/", tier: primary, why: "T-Mobile's official page"}
  - {prefix: "https://instagram.com/attnews", tier: primary, why: "AT&T's official account"}
  - {prefix: "https://linkedin.com/company/", tier: primary, why: "a company's own profile"}
  # News sites: articles are top_secondary, topic/tag index pages carry no claim
  - {prefix: "https://cbsnews.com/news/", tier: top_secondary, why: "bylined national news"}
  - {prefix: "https://consumeraffairs.com/news/", tier: top_secondary, why: "bylined news article"}

