[project]
name = "wire3-gtm-crewai"
version = "0.1.0"
description = "CrewAI implementation of the Wire3 Ocala GTM multi-agent pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.21",
    "crewai-tools[mcp]>=1.15.21",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
